name: Distribute (Firebase App Distribution)

# push のたびにデバッグAPKをビルドし、Firebase App Distribution 経由で
# 自分のテスター端末に配布する。Play Store は使わず、手元のスマホへの
# サイドロード更新を「push→通知→ワンタップ更新」まで自動化するためのもの。
on:
  push:
    branches: ['**']

jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon -PversionCodeOverride=${{ github.run_number }}

      - name: Set up Node (for firebase-tools)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "self" \
            --release-notes "${REF_NAME}@${COMMIT_SHA}: ${COMMIT_MESSAGE}"
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
